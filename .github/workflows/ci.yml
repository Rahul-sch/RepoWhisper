name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: ./scripts/audit_secrets.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: frontend
      - run: swift test
        working-directory: frontend
      - name: Validate shell scripts
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.build/*')
