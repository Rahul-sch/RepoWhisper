name: RepoWhisper
options:
  bundleIdPrefix: com.repowhisper
  deploymentTarget:
    macOS: "14.0"
targets:
  RepoWhisper:
    type: application
    platform: macOS
    sources:
      - path: RepoWhisper
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.repowhisper.app
      INFOPLIST_FILE: RepoWhisper/Info.plist
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ENABLE_HARDENED_RUNTIME: true
      CODE_SIGN_ENTITLEMENTS: RepoWhisper/RepoWhisper.entitlements
    postBuildScripts:
      - name: Embed Local Backend
        script: "${SRCROOT}/scripts/embed_backend.sh"
